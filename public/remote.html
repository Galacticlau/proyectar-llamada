<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#271445">
  <title>Control de llamadas</title>
  <script src="/remote.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100dvh; background: radial-gradient(ellipse at 12% 0%, #542582 0, transparent 58%), linear-gradient(155deg, #2d174d, #190f2d 75%); color: #f9f2ff; font: 1rem/1.5 "DM Sans", system-ui, sans-serif; }
    main { width: min(100%, 34rem); margin: auto; padding: 1.65rem 1rem 2rem; }
    header { display: flex; align-items: center; gap: .75rem; }
    .course { display: grid; place-items: center; flex: none; width: 3.25rem; height: 3.25rem; border: 1px solid #d8afff; border-radius: 1.05rem; color: #32194f; background: #eed2ff; font-weight: 800; }
    h1 { flex: 1; font-size: clamp(1.15rem, 5vw, 1.8rem); line-height: 1.15; margin: 0; }
    h2 { font-size: 1.02rem; margin: 0 0 .55rem; color: #ebd7ff; }
    .card { margin-top: 1.1rem; padding: 1.15rem; border: 1px solid #7854a1; border-radius: 1.35rem; background: #372055; box-shadow: 0 12px 32px #190e2e66; }
    .card:first-child { background: linear-gradient(145deg, #47286d, #382155); }
    button, input { font: inherit; border-radius: .75rem; min-height: 48px; }
    button { cursor: pointer; border: 1px solid #a985c8; background: #432764; color: inherit; padding: .6rem .9rem; }
    button:disabled { cursor: default; opacity: .65; }
    input { width: 100%; display: block; margin: .45rem 0 1rem; padding: .6rem .8rem; border: 1px solid #766891; color: inherit; background: #171128; }
    .primary { width: 100%; min-height: 56px; background: linear-gradient(115deg, #edceff, #c5a1ff); color: #2f144d; border: 0; font-weight: 800; }
    #next { margin: 0; font-size: 1.65rem; line-height: 1.2; font-weight: 800; overflow-wrap: anywhere; }
    #detail { color: #e9d6f7; margin: .55rem 0 1rem; }
    #error { color: #ffc5d0; }
    ol { margin: 0; padding-left: 1.65rem; }
    li { padding: .72rem .25rem; border-bottom: 1px solid #765697; overflow-wrap: anywhere; }
    li::marker { color: #dfbdff; font-weight: 750; }
    li:last-child { border-bottom: 0; }
    :focus-visible { outline: 3px solid #e2cbff; outline-offset: 3px; }
  </style>
</head>
<body>
<main>
  <header>
    <span class="course" id="course" aria-hidden="true"></span>
    <h1>Control de llamadas</h1>
    <button type="button" id="logout" hidden>Salir</button>
  </header>
  <p id="error" role="alert" hidden></p>
  <form class="card" id="login">
    <label for="password">Contraseña del control</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button type="submit" class="primary">Entrar</button>
  </form>
  <div id="controls" hidden>
    <section class="card" aria-labelledby="next-title">
      <h2 id="next-title">Próxima llamada</h2>
      <p id="next"></p>
      <p id="detail" role="status"></p>
      <button id="launch" type="button" class="primary" disabled>Lanzar llamada</button>
    </section>
    <section class="card" aria-labelledby="queue-title">
      <h2 id="queue-title">Lista pendiente</h2>
      <ol id="queue"></ol>
      <p id="empty" hidden>La lista está vacía.</p>
    </section>
  </div>
</main>
</body>
</html>

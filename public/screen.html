<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Llamada para proyectar</title>
<style>
:root {
  font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  color: #fff;
  background: #29211c;
  --wallpaper: url("/wallpaper.webp");
  --phone-width: min(calc((100svh - 148px) / 1.98), 80vw, 480px);
}
* { box-sizing: border-box; }
body { margin: 0; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid #fff; outline-offset: 4px;
}
[hidden] { display: none !important; }
.stage {
  min-height: 100svh;
  isolation: isolate;
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr auto;
  align-items: center;
  padding: clamp(10px, 2vw, 24px);
  gap: 10px;
}
.stage::before, .stage::after {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
}
.stage::before {
  background: var(--wallpaper) 50% 54% / cover;
  transform: scale(1.10); filter: blur(10px) brightness(.66) saturate(.78);
  animation: room-motion 24s ease-in-out infinite alternate;
}
.stage::after {
  background: radial-gradient(ellipse at 50% 46%, transparent 15%, #19110f75 100%);
}
.top, .bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bottom { justify-content: center; }
.chrome {
  color: white;
  background: #1b1613bd;
  border: 1px solid #fff5;
  border-radius: 999px;
  padding: .60rem .86rem;
  font-size: clamp(.72rem, 2.6vw, .9rem);
  min-height: 40px;
  white-space: nowrap;
}
.chrome:hover { background: #2e211b; }
.launch { background: #fff4e7; color: #241a16; border-color: transparent; font-weight: 700; }
.launch:hover { background: white; }
.phone {
  position: relative;
  justify-self: center;
  width: var(--phone-width);
  aspect-ratio: 1 / 1.98;
  padding: calc(var(--phone-width) * .047);
  border-radius: calc(var(--phone-width) * .144);
  background: #070707;
  box-shadow: inset 0 0 0 1px #ffffff3b, 0 20px 58px #100b08ac, 0 3px 9px #100b08ae;
  animation: reveal .48s ease-out both;
}
.stage[data-mode="ringing"] .phone { animation: vibrate 2.8s ease infinite; }
.side {
  position: absolute; width: 4px; border-radius: 2px; background: #090909;
}
.side.left { left: -3px; top: 15%; height: 5%; box-shadow: 0 27px 0 #090909, 0 52px 0 #090909; }
.side.right { right: -3px; top: 23%; height: 12%; }
.display {
  position: relative;
  isolation: isolate;
  height: 100%;
  overflow: hidden;
  border-radius: calc(var(--phone-width) * .103);
  background: #6c594c;
}
.display::before, .display::after {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
}
.display::before {
  background: var(--wallpaper) 54% center / cover;
  animation: screen-motion 13s ease-in-out infinite alternate;
}
.display::after {
  background: linear-gradient(180deg, #141210a8, #17141238 43%, #100e0d29 58%, #0e0b09b0 100%);
}
#video-recording {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; background: #080808; pointer-events: none;
}
.stage[data-video-playing="true"] .identity {
  inset: 5% 6% auto;
  padding: .45rem .65rem;
  border-radius: .65rem;
  background: #080808b8;
}
.stage[data-video-playing="true"] .identity h1 {
  font-size: clamp(.85rem, calc(var(--phone-width) * .051), 1.5rem);
}
.stage[data-video-playing="true"] .state { margin-top: .15rem; }
.notch {
  position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
  width: 53%; height: 4.1%; background: #070707; border-radius: 0 0 14px 14px;
  display: flex; justify-content: center; align-items: center; gap: 10%;
}
.notch::before { content: ""; width: 28%; height: 21%; border-radius: 8px; background: #484848; }
.notch::after { content: ""; height: 28%; aspect-ratio: 1; background: #373838; border-radius: 50%; }
.home {
  position: absolute; bottom: 1.8%; height: max(3px, calc(var(--phone-width) * .012));
  left: 34%; width: 32%; background: #ffffffb5; border-radius: 10px;
}
.identity {
  position: absolute; inset: 10% 5% auto; text-align: center;
  text-shadow: 0 2px 10px #000c;
}
.identity h1 {
  margin: 0;
  font-size: clamp(1.1rem, calc(var(--phone-width) * .094), 2.8rem);
  font-weight: 560; letter-spacing: -.04em; line-height: 1.03; overflow-wrap: anywhere;
}
.state {
  margin: .5rem 0 0;
  font-size: clamp(.8rem, calc(var(--phone-width) * .05), 1.35rem);
  font-weight: 550; font-variant-numeric: tabular-nums;
}
.dots { display: inline-grid; grid-auto-flow: column; align-items: center; gap: 3px; margin-left: .22em; }
.dots i { width: .18em; aspect-ratio: 1; background: currentColor; border-radius: 50%; animation: dot 1.4s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .30s; }
.actions {
  position: absolute; inset: auto 9% 10%;
  display: flex; align-items: flex-end; justify-content: space-between; gap: .6rem;
}
.actions.centered { justify-content: center; }
.action {
  display: grid; place-items: center; gap: .5rem; padding: 0 2px;
  border: 0; background: transparent; color: white;
  font-size: clamp(.72rem, calc(var(--phone-width) * .043), 1.2rem);
  font-weight: 650; text-shadow: 0 1px 6px #000c;
}
.disc {
  position: relative; display: grid; place-items: center;
  width: clamp(39px, calc(var(--phone-width) * .204), 94px);
  aspect-ratio: 1;
  border-radius: 50%; background: #21b849;
  box-shadow: 0 4px 18px #0004;
}
.disc svg { width: 57%; height: 57%; fill: currentColor; }
.end .disc { background: #ef2836; }
.end .disc svg { transform: rotate(135deg); }
.action:hover .disc { filter: brightness(1.14); }
.accept .disc::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid #88ffab;
  animation: pulse 2s infinite; pointer-events: none;
}
.snooze {
  position: absolute; bottom: 31%; left: 50%; transform: translateX(-50%);
  background: #17151093; color: white; border: 1px solid #fff6;
  border-radius: 999px; padding: .40rem .7rem;
  font-size: clamp(.66rem, calc(var(--phone-width) * .035), 1rem);
}
.wave {
  display: flex; gap: 5px; align-items: center; justify-content: center;
  margin: .8rem auto 0; height: 20px;
}
.wave i { width: 4px; height: 100%; background: #e8ffed; border-radius: 4px; animation: wave .8s ease-in-out infinite alternate; }
.wave i:nth-child(2n) { animation-delay: -.4s; }
.wave i:nth-child(3n) { animation-delay: -.2s; }
.notice {
  position: absolute; inset: auto 7% 11%; margin: 0; text-align: center;
  background: #1a1412dc; padding: .7rem; border-radius: 12px;
  font-size: clamp(.73rem, calc(var(--phone-width) * .039), 1.05rem);
}
dialog {
  color: white; border: 1px solid #ffffff50; border-radius: 22px; padding: 1.35rem;
  background: #2a201b; width: min(440px, 92vw); max-height: 90svh; box-shadow: 0 16px 60px #0f0a08a0;
}
dialog::backdrop { background: #100c0abd; }
dialog h2 { font-size: 1.4rem; letter-spacing: -.03em; margin: 0 0 1rem; }
form, .field { display: grid; gap: .4rem; }
form { gap: .95rem; }
.field label, .toggle { font-size: .91rem; font-weight: 600; }
.field input, .field select {
  min-width: 0; width: 100%; border: 1px solid #fff6; border-radius: 8px;
  background: #181210; color: white; padding: .57rem .65rem;
}
input::file-selector-button {
  font: inherit; border: 0; border-radius: 4px; padding: .3rem .45rem; color: white;
  background: #fff2; margin-right: .5rem; cursor: pointer;
}
.toggle { display: flex; align-items: center; gap: .45rem; }
.toggle input { accent-color: #e9c9ab; }
.hint { color: #e2ccc0; margin: 0; font-size: .8rem; }
.dialog-actions { display: flex; justify-content: flex-end; gap: .55rem; flex-wrap: wrap; }
@keyframes reveal { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes room-motion { to { transform: scale(1.19) translate(-1.8%, 1%); } }
@keyframes screen-motion { from { transform: scale(1.02); } to { transform: scale(1.13) translate(-1%, 1.4%); } }
@keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(1.45); opacity: 0; } }
@keyframes vibrate {
  0%, 15%, 100% { transform: none; }
  3%, 9% { transform: translateX(-3px) rotate(-1deg); }
  6%, 12% { transform: translateX(3px) rotate(1deg); }
}
@keyframes wave { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
@keyframes dot { 0%, 70%, 100% { opacity: .28; } 32% { opacity: 1; } }
@media (max-height: 530px) and (orientation: landscape) {
  :root { --phone-width: min(41svh, 80vw); }
  .top, .bottom { position: absolute; z-index: 1; }
  .top { inset: 10px 10px auto; }
  .bottom { inset: auto 10px 10px; justify-content: flex-start; }
  .stage { grid-template-rows: 1fr; }
}
@media (orientation: portrait) {
  :root { --phone-width: min(calc((100svh - 124px) / 1.98), 83vw, 480px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}

[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="stage" id="stage" data-mode="ready">
  <div class="top">
    
    <button class="chrome" id="fullscreen" type="button">Pantalla completa</button>
  </div>
  <section class="phone" aria-label="Teléfono">
    <span class="side left" aria-hidden="true"></span><span class="side right" aria-hidden="true"></span>
    <div class="display">
      <video id="video-recording" preload="none" playsinline disablepictureinpicture hidden></video>
      <div class="notch" aria-hidden="true"></div>
      <div class="identity">
        <h1 id="caller">En espera</h1>
        <p class="state"><span id="status" role="status">Conectando…</span><span class="dots" id="dots" aria-hidden="true" hidden><i></i><i></i><i></i></span></p>
        <div class="wave" id="wave" aria-hidden="true" hidden><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <button class="snooze" id="snooze" type="button" hidden>Posponer 5 s</button>
      <div class="actions" id="ring-actions" hidden>
        <button class="action end" id="reject" type="button">
          <span class="disc" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#handset"/></svg></span>Rechazar
        </button>
        <button class="action accept" id="answer" type="button">
          <span class="disc" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#handset"/></svg></span>Contestar
        </button>
      </div>
      <p class="notice" id="notice" role="alert" hidden></p>
      <div class="home" aria-hidden="true"></div>
    </div>
  </section>
  <div class="bottom">
    <button class="chrome launch" id="enable" type="button">Activar sonido</button>
    <p class="hint" id="projection-hint" hidden>Para contestar, abre la pantalla desde Administración.</p>
  </div>
</main>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs><path id="handset" d="M5.2 3.3c.6-.6 1.6-.5 2.1.2l3 3.9c.5.6.4 1.5-.2 2l-1.7 1.5c1.2 2 2.8 3.6 4.8 4.8l1.5-1.7c.5-.6 1.4-.7 2-.2l3.9 3c.7.5.8 1.5.2 2.1l-1.7 1.7c-.8.8-2 .9-3.1.6C9.4 19.4 4.6 14.6 2.8 8c-.3-1.1-.2-2.3.6-3.1z"/></defs>
</svg>

<audio id="recording" preload="auto"></audio>
<audio id="ringtone" preload="auto" loop src="/ringtone.mp3"></audio>
<noscript>Activa JavaScript para usar la pantalla de proyección.</noscript>
<script src="/screen.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151128">
  <title>Control de llamadas · 4A</title>
  <script src="/remote-4a.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #151128; color: #f7f3ff; font: 1rem/1.5 "DM Sans", system-ui, sans-serif; }
    main { width: min(100%, 36rem); margin: auto; padding: 1.25rem 1rem 2rem; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { font-size: clamp(1.4rem, 5vw, 2rem); margin: 0; }
    h2 { font-size: 1.1rem; margin: 0 0 .5rem; }
    .card { margin-top: 1rem; padding: 1.1rem; border: 1px solid #443953; border-radius: 1rem; background: #211a35; }
    button, input { font: inherit; border-radius: .75rem; min-height: 48px; }
    button { cursor: pointer; border: 1px solid #544a6d; background: #33294d; color: inherit; padding: .6rem .9rem; }
    button:disabled { cursor: default; opacity: .65; }
    input { width: 100%; display: block; margin: .45rem 0 1rem; padding: .6rem .8rem; border: 1px solid #766891; color: inherit; background: #171128; }
    .primary { width: 100%; min-height: 56px; background: #d2b6ff; color: #211432; border: 0; font-weight: 750; }
    #next { margin: 0; font-size: 1.4rem; font-weight: 700; overflow-wrap: anywhere; }
    #detail, #status { color: #ddd3ed; margin: .35rem 0 1rem; }
    #error { color: #ffc5d0; }
    ol { margin: 0; padding-left: 1.8rem; }
    li { padding: .7rem .1rem; border-bottom: 1px solid #443953; overflow-wrap: anywhere; }
    li:last-child { border-bottom: 0; }
    :focus-visible { outline: 3px solid #e2cbff; outline-offset: 3px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Control de llamadas · 4A</h1>
    <button type="button" id="logout" hidden>Salir</button>
  </header>
  <p id="error" role="alert" hidden></p>
  <form class="card" id="login">
    <label for="password">Contraseña del control</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button type="submit" class="primary">Entrar</button>
  </form>
  <div id="controls" hidden>
    <section class="card" aria-labelledby="next-title">
      <h2 id="next-title">Próxima llamada</h2>
      <p id="next"></p>
      <p id="detail" role="status"></p>
      <button id="launch" type="button" class="primary" disabled>Lanzar llamada</button>
    </section>
    <section class="card" aria-labelledby="queue-title">
      <h2 id="queue-title">Lista pendiente</h2>
      <ol id="queue"></ol>
      <p id="empty" hidden>La lista está vacía.</p>
    </section>
  </div>
</main>
</body>
</html>
